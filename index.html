<!-- ================================ WEBSITE =============================== -->
<main class="stage" id="stage">

  <!-- 1 · THE INVITATION -->
  <article class="card hero" id="top" data-gate>
    <p class="t r italic bless" style="--y:360;--fs:30;--lh:42;--ls:.04em" data-lines="blessing"></p>

    <p class="t r serif nm fit" style="--y:510;--fs:56;--ls:.02em" data-fit-w="820" data-fit-group="n" data-t="bride.name"></p>
    <p class="t r italic with" style="--y:615;--fs:42;--ls:.04em">With</p>
    <p class="t r serif nm fit" style="--y:720;--fs:56;--ls:.02em" data-fit-w="820" data-fit-group="n" data-t="groom.name"></p>
    <div class="t r event-overview" id="event-overview" style="--y:1000"></div>
  </article>

  <!-- 2 · VENUE -->
  <article class="card" id="venue">
    <div class="watermark" id="venue-wm" aria-hidden="true"></div>
    <div class="stack">
      <p class="r caps small" style="--ls:.34em">Find Your Way</p>
      <svg class="r orn-inline" viewBox="0 0 300 24" aria-hidden="true"><use href="#orn"/></svg>
      <h2 class="r script big">The Venue</h2>
      <div class="r event-list" id="event-list"></div>
    </div>
  </article>

  <!-- 3 · COUNTDOWN -->
  <article class="card" id="countdown">
    <div class="stack">
      <p class="r caps small" style="--ls:.34em" data-t="countdown.kicker"></p>
      <svg class="r orn-inline" viewBox="0 0 300 24" aria-hidden="true"><use href="#orn"/></svg>
      <h2 class="r script big" data-t="countdown.heading"></h2>
      <div class="r count" id="count" aria-live="off">
        <div><b id="cd">00</b><span>Days</span></div>
        <div><b id="ch">00</b><span>Hours</span></div>
        <div><b id="cm">00</b><span>Mins</span></div>
        <div><b id="cs">00</b><span>Secs</span></div>
      </div>
      <p class="r serif note" id="cd-note"></p>
      <button class="r btn ghost" id="cal" type="button"><span>Add to Calendar</span></button>
    </div>
  </article>

  <!-- 4 · THANK YOU -->
  <article class="card" id="thanks">
    <div class="stack">
      <h2 class="r script big" data-t="thanks.heading"></h2>
      <svg class="r orn-inline" viewBox="0 0 300 24" aria-hidden="true"><use href="#orn"/></svg>
      <p class="r italic thanks-line" data-t="thanks.line"></p>
      <p class="r serif note" data-t="thanks.message"></p>
      <div class="r actions">
        <button class="btn" id="share" type="button"><span>Share Invitation</span></button>
        <a class="btn ghost" id="rsvp" target="_blank" rel="noopener" hidden><span>RSVP on WhatsApp</span></a>
        <button class="btn ghost" id="again" type="button"><span>Open Again</span></button>
      </div>
    </div>
  </article>

</main>

  <div class="sheet-bg" data-close></div>

    <button class="sheet-x" type="button" data-close aria-label="Close">×</button>
    <h3 id="sheet-title" class="script">Share Invitation</h3>

    <div class="link-row">
      <input id="share-url" type="text" readonly aria-label="Invitation link">
      <button id="copy" class="btn" type="button"><span>Copy Link</span></button>
    </div>
    <p class="sheet-hint" id="share-hint" hidden></p>
